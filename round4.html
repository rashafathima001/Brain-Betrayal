<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Round 4</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="game-page">

    <div class="round-top">

        <span>ROUND 4 / 5</span>

        <div class="progress">
            <div style="width:80%"></div>
        </div>

    </div>

    <section class="game-card">

        <p class="eyebrow">🤯 BRAIN TRAP</p>

        <h1>DON'T TRUST YOUR BRAIN</h1>

        <p id="roundDesc" class="description">
            Read this sentence carefully.
        </p>

        <div id="memory" class="sentence-box">
            🧠 Loading brain teaser...
        </div>

        <div id="timer" class="timer">
            5
        </div>

        <div id="question" class="question hidden">

            <h2 id="questionText">Which color was it?</h2>

            <div class="options">
                <!-- Dynamically populated -->
            </div>

        </div>

    </section>

</main>

<script src="audioManager.js"></script>
<script src="questionEngine.js"></script>
<script src="round4.js"></script>

</body>
</html>
