<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Round 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game-page">

    <div class="round-top">

        <span>ROUND 2 / 5</span>

        <div class="progress">
            <div style="width:40%"></div>
        </div>

    </div>

    <section class="game-card">

        <p class="eyebrow">👀 ATTENTION TEST</p>

        <h1>DON'T GET DISTRACTED</h1>

        <p id="roundDesc" class="description">
            Pay close attention to what's next to each item.
        </p>

        <div id="memory" class="memory-box">
            🧠 Loading items...
        </div>

        <div id="timer" class="timer">
            5
        </div>

        <div id="question" class="question hidden">

            <h2 id="questionText">What was next to the item?</h2>

            <div class="options">
                <!-- Populated dynamically -->
            </div>

        </div>

    </section>

</main>

<script src="audioManager.js"></script>
<script src="questionEngine.js"></script>
<script src="round2.js"></script>

</body>
</html>
