<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Round 3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game-page">

    <div class="round-top">

        <span>ROUND 3 / 5</span>

        <div class="progress">
            <div style="width:60%"></div>
        </div>

    </div>

    <section class="game-card">

        <p class="eyebrow">🍓 MEMORY TRAP</p>

        <h1>THE MEMORY TRAP</h1>

        <p id="roundDesc" class="description">
            One item below is NOT actually there.
        </p>

        <div id="memory" class="memory-box">
            🧠 Loading category items...
        </div>

        <div id="timer" class="timer">
            5
        </div>

        <div id="question" class="question hidden">

            <h2 id="questionText">Which item was NOT shown?</h2>

            <div class="options">
                <!-- Populated dynamically -->
            </div>

        </div>

    </section>

</main>

<script src="audioManager.js"></script>
<script src="questionEngine.js"></script>
<script src="round3.js"></script>

</body>
</html>
