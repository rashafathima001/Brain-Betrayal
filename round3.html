<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Round 3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game-page">

    <div class="round-top">

        <span>ROUND 3 / 5</span>

        <div class="progress">
            <div style="width:60%"></div>
        </div>

    </div>

    <section class="game-card">

        <p class="eyebrow">🍓 MEMORY TRAP</p>

        <h1>THE MEMORY TRAP</h1>

        <p class="description">
            One fruit below is NOT actually there.
        </p>

        <div id="memory" class="memory-box">
            🍎 &nbsp; 🍌 &nbsp; 🍉 &nbsp; 🍓 &nbsp; 🍇
        </div>

        <div id="timer" class="timer">
            5
        </div>

        <div id="question" class="question hidden">

            <h2 id="questionText">Which fruit was NOT shown?</h2>

            <div class="options">

                <button data-answer="🍊">🍊</button>
                <button data-answer="🍎">🍎</button>
                <button data-answer="🍇">🍇</button>
                <button data-answer="🍓">🍓</button>

            </div>

        </div>

    </section>

</main>

<script src="questionEngine.js"></script>
<script src="round3.js"></script>

</body>
</html>
