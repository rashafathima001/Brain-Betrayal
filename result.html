<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Final Result</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<canvas id="confettiCanvas" class="confetti-canvas"></canvas>

<main class="page">

    <section class="result-card">

        <div class="trophy" id="trophyIcon">
            🏆
        </div>

        <p class="eyebrow">
            THE BETRAYAL IS COMPLETE
        </p>

        <h1 id="playerResult">
            PLAYER
        </h1>

        <div class="score-circle">

            <strong id="score">
                0
            </strong>

            <span>/ 100</span>

        </div>

        <h2 id="brainType">
            🧠 CALCULATING...
        </h2>

        <div class="stats">

            <div>
                <strong id="accuracy">
                    0%
                </strong>

                <span>ACCURACY</span>
            </div>

            <div>
                <strong id="confidence">
                    0%
                </strong>

                <span>CONFIDENCE</span>
            </div>

            <div>
                <strong id="correct">
                    0/5
                </strong>

                <span>CORRECT</span>
            </div>

        </div>

        <p id="message" class="final-message">
            Calculating brain damage...
        </p>

        <div id="friendChallengeBox" class="friend-challenge-card hidden">
            <span class="challenge-icon">⚔️</span>
            <div class="challenge-body">
                <strong id="friendChallengeTitle">FRIEND CHALLENGE!</strong>
                <p id="friendChallengeText">Think you beat your friend? Take a screenshot and send it!</p>
            </div>
        </div>

        <button
            class="main-btn"
            onclick="location.href='setup.html'"
            style="width: 100%; margin-top: 15px;"
        >
            PLAY AGAIN 🔄
        </button>

        <br>

        <button
            class="text-btn"
            onclick="location.href='index.html'"
        >
            ← Back to Home
        </button>

    </section>

</main>

<script src="audioManager.js"></script>
<script src="result.js"></script>

</body>
</html>
