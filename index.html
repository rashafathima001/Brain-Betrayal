<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brain Betrayal - The Ultimate Memory Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page home">

        <div class="brain-icon pulse-glow">🧠</div>

        <p class="eyebrow">THE ULTIMATE MEMORY TEST</p>

        <h1>
            BRAIN<br>
            <span>BETRAYAL</span>
        </h1>

        <p class="subtitle">
            You trust your brain.<br>
            Your brain doesn't trust you. 💀
        </p>

        <div class="feature-row">

            <div class="feature">
                <b>5</b>
                <small>ROUNDS</small>
            </div>

            <div class="feature">
                <b>🧠</b>
                <small>MEMORY</small>
            </div>

            <div class="feature">
                <b>💀</b>
                <small>CHAOS</small>
            </div>

        </div>

        <button
            id="startBtn"
            class="main-btn glow-btn"
            onclick="startGame()"
        >
            START THE BETRAYAL →
        </button>

        <p class="warning">
            ⚠️ Side effects may include severe embarrassment.
        </p>

    </main>

    <script src="audioManager.js"></script>
    <script>
        function startGame() {
            if (typeof AudioManager !== "undefined") {
                AudioManager.playTick();
                AudioManager.startBgm();
            }
            setTimeout(function() {
                location.href = 'setup.html';
            }, 180);
        }
    </script>

</body>
</html>
